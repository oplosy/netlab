# AUTO-510 NetBox projection of Git intent (ADR 0019). Images are pinned in
# versions.env; secrets come from artifacts/netbox/netbox.env, generated by
# automation/netbox/prepare.py and never committed. NetBox listens on
# 127.0.0.1 only and is not attached to the lab networks.
name: netlab-netbox
services:
  netbox:
    image: ${NETBOX_IMAGE:?set in versions.env}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    depends_on: [postgres, redis]
    env_file: [../../artifacts/netbox/netbox.env]
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["netbox-media:/opt/netbox/netbox/media"]
    restart: unless-stopped
  postgres:
    image: ${NETBOX_POSTGRES_IMAGE:?set in versions.env}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    env_file: [../../artifacts/netbox/netbox.env]
    volumes: ["netbox-postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
  redis:
    image: ${NETBOX_VALKEY_IMAGE:?set in versions.env}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    env_file: [../../artifacts/netbox/netbox.env]
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["netbox-redis:/data"]
    restart: unless-stopped
volumes:
  netbox-media:
  netbox-postgres:
  netbox-redis:

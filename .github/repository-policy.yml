# Declarative target for the repository administrator or GitHub Settings App.
# The settings are intentionally explicit so the live branch-protection
# readback can be compared with this file.
repository:
  default_branch: main
  allow_squash_merge: false
  allow_rebase_merge: false
  allow_merge_commit: true
  delete_branch_on_merge: true

branches:
  main:
    protection:
      required_status_checks:
        strict: true
        contexts:
          - Pull Request Policy / policy
      enforce_admins: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      restrictions: null
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false

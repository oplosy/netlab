name: Pull Request Policy

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject committed local-only files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env|\.env\.[^/]+)$|(^|/)(secrets|artifacts/runs)/|\.(key|pem)$'
          if git ls-files | grep -E "$forbidden"; then
            echo 'A local secret or generated runtime path is tracked.' >&2
            exit 1
          fi

      - name: Validate governance files
        shell: bash
        run: |
          set -euo pipefail
          test -s CODEOWNERS
          test -s .editorconfig
          test -s .github/pull_request_template.md
          test -s .github/repository-policy.yml

      # CI-050: static quality gate, kept in the required `policy` job.
      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          uv_version=$(sed -n 's/^UV_VERSION=//p' versions.env)
          pipx install "uv==${uv_version}"
          uv --version

      - name: Run static quality gate
        shell: bash
        run: make ci-static

  # AUTO-540: bounded topology smoke test. Separate from the required `policy`
  # job; bounded by the job timeout, SMOKE_TIMEOUT, and per-node CPU/memory
  # limits in lab/ci-smoke.clab.yml. Needs no credentials.
  topology-smoke:
    name: topology-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned containerlab
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          deb="containerlab_${CONTAINERLAB_VERSION}_linux_amd64.deb"
          curl -fsSLo "/tmp/${deb}" \
            "https://github.com/srl-labs/containerlab/releases/download/v${CONTAINERLAB_VERSION}/${deb}"
          echo "${CONTAINERLAB_DEB_SHA256}  /tmp/${deb}" | sha256sum --check
          sudo dpkg -i "/tmp/${deb}"
          containerlab version

      - name: Build the pinned network-node image
        shell: bash
        run: NETLAB_BUILD_ONLY=network-node bash scripts/images/build.sh

      - name: Run the bounded topology smoke test
        shell: bash
        run: SUDO=sudo SMOKE_TIMEOUT=300 bash scripts/ci/topology-smoke.sh

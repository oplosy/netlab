global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {lab: phase-1}
scrape_configs:
  - job_name: snmp
    metrics_path: /snmp
    params: {auth: [netlab], module: [if_mib]}
    static_configs:
      - targets: [172.31.255.20, 172.31.255.21, 172.31.255.30, 172.31.255.31, 172.31.255.32, 172.31.255.33, 172.31.255.34, 172.31.255.50, 172.31.255.51, 172.31.255.52, 172.31.255.53, 172.31.255.54, 172.31.255.70, 172.31.255.71, 172.31.255.72, 172.31.255.73, 172.31.255.74]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "172.31.255.14:9116"}
  - job_name: goflow2
    static_configs:
      - targets: [127.0.0.1:6060]

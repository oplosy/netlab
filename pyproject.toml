[project]
name = "netlab"
version = "0.1.0"
description = "Reproducible multi-site enterprise network lab tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ansible-core>=2.21,<2.22",
  "ansible-lint>=26.8,<26.9",
  "Jinja2>=3.1,<4",
  "jsonschema>=4.26,<4.27",
  "mypy>=2.3,<2.4",
  "pytest>=9.1,<9.2",
  "PyYAML>=6.0,<7",
  "ruff>=0.16,<0.17",
  "yamllint>=1.38,<1.39",
]

[tool.uv]
required-version = ">=0.12,<0.13"

schema_version: 2

# Delivery workflow: docs/plans/workflow.md (ADR 0016).
# Phase 5 tasks are stretch goals and not part of the definition of done.
project:
  name: multi-site-enterprise-network-lab
  base_branch: main

tasks:
  - id: GOV-001
    phase: phase-0
    title: Bootstrap main and repository protections
    status: complete
    depends_on: []
    acceptance:
      - "A direct push to main is rejected"
      - "A feature branch can open a pull request to main"
    verify:
      - "Record GitHub branch protection readback"
      - "Record a non-mutating repository/default-branch check"

  - id: ENV-010
    phase: phase-0
    title: Add environment preflight and version policy
    status: complete
    depends_on: [GOV-001]
    acceptance:
      - "Preflight returns zero on a supported host"
      - "Each missing prerequisite produces an actionable nonzero result"
      - "The preflight does not install or remove host software"
      - "The Python environment resolves reproducibly from uv.lock"
    verify:
      - "make preflight"

  - id: IMG-020
    phase: phase-0
    title: Build reproducible lab node images
    status: complete
    depends_on: [GOV-001, ENV-010]
    acceptance:
      - "Two consecutive clean builds produce the expected component versions"
      - "No image uses a floating tag"
      - "OVS datapath selection is explicit and evidenced"
    verify:
      - "make images"
      - "make verify-images"

  - id: IMG-025
    phase: phase-0
    title: Install the strongSwan ECP-384 crypto backend
    status: complete
    depends_on: [IMG-020]
    acceptance:
      - "Installed OpenSSL provider version matches STRONGSWAN_VERSION"
      - "Network-node image exposes ECP-384 and ECDSA certificate parsing"
      - "No legacy strongSwan starter daemon is introduced"
    verify:
      - "make images"
      - "make verify-images"

  - id: DAT-030
    phase: phase-0
    title: Define authoritative inventory and schema
    status: complete
    depends_on: [GOV-001]
    acceptance:
      - "Duplicate IPs and ASNs fail when uniqueness is required"
      - "Overlapping prefixes and invalid peer references fail"
      - "All values match the accepted addressing ADR"
    verify:
      - "make validate-inventory"
      - "make test-unit"

  - id: TOP-040
    phase: phase-0
    title: Create the Phase 1 topology skeleton
    status: complete
    depends_on: [ENV-010, IMG-020, DAT-030]
    acceptance:
      - "All declared nodes become healthy"
      - "Management IP masquerading is disabled"
      - "Destroy leaves no project container, bridge, or namespace"
    verify:
      - "make lab-up"
      - "make smoke"
      - "make lab-down"
      - "make verify-clean"

  - id: L2-110
    phase: phase-1
    title: Implement site VLAN, LACP, and RSTP behavior
    status: complete
    depends_on: [TOP-040]
    acceptance:
      - "VLAN isolation passes"
      - "A port channel never spans distribution nodes"
      - "LACP member failure interruption is at most 1 second"
      - "RSTP active-path failure interruption is at most 5 seconds"
    verify:
      - "make test-l2"

  - id: L2-111
    phase: phase-1
    title: Prove distribution peer VLAN adjacency
    status: complete
    depends_on: [L2-110]
    acceptance:
      - "Each distribution node resolves its peer SVI address on VLANs 10, 20, 30, and 99"
      - "Peer adjacency remains available through the active RSTP path"
      - "Guest VLAN isolation remains denied"
    verify:
      - "make test-l2"
      - "make test-l2-peer"

  - id: L3-120
    phase: phase-1
    title: Implement SVIs, VRRP, and routed edge links
    status: complete
    depends_on: [L2-110, L2-111]
    acceptance:
      - "Clients use the VRRP virtual IP"
      - "Gateway ownership moves after master failure"
      - "VRRP preference is aligned with RSTP root preference"
    verify:
      - "make test-l3"

  - id: OSPF-130
    phase: phase-1
    title: Implement OSPF areas, summaries, and BFD
    status: complete
    depends_on: [L3-120, VPN-150]
    acceptance:
      - "No adjacency forms on a passive interface"
      - "Area 0 receives site summaries instead of VLAN specifics"
      - "Routed-link failure interruption is at most 3 seconds"
      - "Partial site failure does not create an unexplained black hole"
    verify:
      - "make test-ospf"

  - id: OSPF-131
    phase: phase-1
    title: Stabilize BFD-triggered gateway failover within three seconds
    status: complete
    depends_on: [OSPF-130, L3-120]
    acceptance:
      - "HQ routed-link loss restores VIP traffic within three seconds"
      - "At least three consecutive live measurements meet the limit"
      - "Existing passive-interface, summary, BFD, and default-origination checks remain green"
    verify:
      - "make test-ospf"

  - id: OSPF-132
    phase: phase-1
    title: Preserve eBGP routing while enabling OSPF and BFD daemons
    status: complete
    depends_on: [OSPF-130, OSPF-131, WAN-140]
    acceptance:
      - "Applying OSPF twice leaves both site eBGP sessions established"
      - "HQ and Branch 1 retain the BGP-learned default after OSPF apply"
      - "Site-local NTP services synchronize through the simulated ISP path"
    verify:
      - "make lab-up"
      - "bash automation/roles/ipsec/apply.sh"
      - "Apply OSPF twice and inspect BGP summary/default route on both site edges"
      - "make test-services"
      - "make verify-clean"

  - id: WAN-140
    phase: phase-1
    title: Implement ISP simulation and eBGP policy
    status: complete
    depends_on: [TOP-040]
    acceptance:
      - "Each site imports only a default route"
      - "ISP 1 learns no RFC1918 enterprise prefix"
      - "Injected unauthorized advertisements are rejected"
    verify:
      - "make test-bgp"

  - id: VPN-150
    phase: phase-1
    title: Implement the IKEv2 XFRM overlay
    status: complete
    depends_on: [L3-120, WAN-140, IMG-025]
    acceptance:
      - "No generated private key or certificate is tracked"
      - "XFRM peer addresses communicate only after IPsec is established"
      - "Underlay capture contains ESP and no plaintext enterprise packet"
      - "Rekey does not exceed the convergence objective"
    verify:
      - "make test-ipsec"

  - id: SVC-160
    phase: phase-1
    title: Implement enterprise infrastructure services
    status: complete
    depends_on: [L3-120, TOP-040]
    acceptance:
      - "Clients receive the correct subnet, gateway, DNS, and NTP data"
      - "Internal and simulated Internet names resolve"
      - "Guest DNS and NTP work while other guest-to-server traffic is denied"
      - "Client VLANs cannot reach OOB management addresses"
      - "Central AAA and fallback behavior are both exercised"
    verify:
      - "make test-services"

  - id: SEC-170
    phase: phase-1
    title: Enforce segmentation, control-plane policy, and guest NAT
    status: complete
    depends_on: [OSPF-130, WAN-140, SVC-160]
    acceptance:
      - "Guest approved Internet traffic succeeds"
      - "Guest access to server, corporate, in-band management, and OOB fails"
      - "Unauthorized control-plane traffic fails"
      - "Denies emit rate-limited correlated logs"
    verify:
      - "make test-security"

  - id: OBS-180
    phase: phase-1
    title: Implement correlated network observability
    status: complete
    depends_on: [TOP-040, SVC-160]
    acceptance:
      - "SNMPv3 authPriv succeeds and SNMPv2c fails"
      - "A known flow appears with correct endpoints and interfaces"
      - "A link event appears in both metrics and logs with matching time"
    verify:
      - "make test-observability"

  - id: TEST-190
    phase: phase-1
    title: Build the end-to-end evidence suite
    status: complete
    depends_on: [OSPF-130, OSPF-131, VPN-150, SEC-170, OBS-180]
    acceptance:
      - "Every Phase 1 definition-of-done claim is produced by one run"
      - "A missed quantitative threshold fails the run"
      - "Teardown executes even after a failed test"
    verify:
      - "make evidence-phase-1"

  - id: DOC-195
    phase: phase-1
    title: Publish rebuild and operations runbooks
    status: complete
    depends_on: [TEST-190]
    acceptance:
      - "A clean environment can follow only committed instructions"
      - "Documented expected outputs match the verified implementation"
      - "No committed packet capture exceeds 5 MiB or exposes a secret"
    verify:
      - "Follow the clean rebuild runbook"
      - "make evidence-phase-1"
      - "make lab-down"
      - "make verify-clean"

  - id: WAN-210
    phase: phase-2
    title: Add ISP 2 and redundant edge nodes
    status: complete
    depends_on: [DOC-195]
    acceptance:
      - "HQ and BR1 edge-1 and edge-2 establish filtered eBGP sessions to both ISPs"
      - "Each site edge-2 has routed links to both site distribution nodes"
      - "Phase 1 endpoint and IPsec traffic remain on edge-1 until WAN-230 enables secondary overlay endpoints"
      - "Phase 1 behavior remains green before failover policy is enabled"
    verify:
      - "make test-bgp"

  - id: WAN-220
    phase: phase-2
    title: Add deterministic dual-provider BGP policy
    status: complete
    depends_on: [WAN-210]
    acceptance:
      - "Primary and backup paths match documented policy"
      - "Prefix leaks and excessive advertisements are rejected"
    verify:
      - "make test-bgp-multihoming"

  - id: WAN-230
    phase: phase-2
    title: Add redundant encrypted overlay paths
    status: complete
    depends_on: [WAN-220]
    acceptance:
      - "Both overlay paths encrypt traffic"
      - "OSPF cost selects the intended healthy underlay"
    verify:
      - "make test-ipsec-redundancy"

  - id: TEST-240
    phase: phase-2
    title: Verify provider and edge failover
    status: complete
    depends_on: [WAN-230]
    acceptance:
      - "Provider, edge, and tunnel failures converge within 10 seconds"
      - "Return path matches policy where symmetry is required"
    verify:
      - "make evidence-phase-2"

  - id: SITE-310
    phase: phase-3
    title: Extract a reusable branch site template
    status: complete
    depends_on: [TEST-240]
    acceptance:
      - "Branch 1 renders without behavioral changes"
      - "No generated runtime state is copied into the template"
    verify:
      - "make test-site-template"
      - "make evidence-phase-1"

  - id: SITE-320
    phase: phase-3
    title: Instantiate Branch 2 from data
    status: complete
    depends_on: [SITE-310]
    acceptance:
      - "Branch 2 uses 10.30.0.0/16, Area 30, and AS 65102"
      - "Branch 2 is produced from the shared site template"
    verify:
      - "make test-branch-2"

  - id: SITE-330
    phase: phase-3
    title: Verify Branch 2 routing and isolation
    status: complete
    depends_on: [SITE-320]
    acceptance:
      - "Area 0 gains exactly one Branch 2 summary"
      - "Guest and management isolation remains intact"
      - "Branch 1 acceptance does not regress"
    verify:
      - "make evidence-phase-3"

  - id: CI-050
    phase: phase-4
    title: Add the static CI quality gate
    status: complete
    depends_on: [SITE-330]
    acceptance:
      - "Inventory schema validation, topology render check, ruff, yamllint, and unit tests run on every pull request to main"
      - "The committed-secret and runtime-path check keeps running in the same required policy job"
      - "CI needs no lab runtime, Docker daemon, or committed credentials"
      - "A deliberately broken inventory or failing unit test makes the check fail"
    verify:
      - "make ci-static"
      - "Record the GitHub check result for the pull request"

  - id: EDGE-410
    phase: phase-4
    title: Add the SecureEdge zone firewall tier
    status: complete
    depends_on: [CI-050]
    acceptance:
      - "Inside, outside, guest, management, and service zones fail closed"
      - "Bypass around the security tier is not routable"
    verify:
      - "make test-secure-edge"

  - id: EDGE-420
    phase: phase-4
    title: Add Suricata IDS and IPS behavior
    status: complete
    depends_on: [EDGE-410]
    acceptance:
      - "Curated test signatures generate deterministic alerts"
      - "Configured IPS test traffic is blocked"
      - "Failure-mode behavior matches the documented fail-open/fail-closed policy"
    verify:
      - "make test-suricata"

  - id: EDGE-430
    phase: phase-4
    title: Correlate SecureEdge decisions with network evidence
    status: complete
    depends_on: [EDGE-420]
    acceptance:
      - "Firewall decision, IDS alert, packet, and IPFIX record share the run ID"
      - "Allowed and blocked cases are both represented"
    verify:
      - "make evidence-phase-4"

  - id: AUTO-510
    phase: phase-5
    stretch: true
    title: Build the NetBox intent projection
    status: complete
    depends_on: [EDGE-430]
    acceptance:
      - "An empty NetBox database is seeded from Git intent"
      - "A second reconciliation is idempotent"
      - "A NetBox-only edit is reported as drift"
    verify:
      - "make test-netbox-sync"

  - id: AUTO-520
    phase: phase-5
    stretch: true
    title: Generate Ansible inventory and configurations
    status: complete
    depends_on: [AUTO-510]
    acceptance:
      - "Generated inventory matches validated Git intent and NetBox projection"
      - "Rendering is deterministic and identifies generated files"
    verify:
      - "make render"
      - "make test-render"

  - id: AUTO-530
    phase: phase-5
    stretch: true
    title: Add safe change, idempotence, and drift workflows
    status: complete
    depends_on: [AUTO-520]
    acceptance:
      - "Precheck, backup, diff, apply, and postcheck stages are explicit"
      - "A second apply reports no material change"
      - "Intent and device drift produce a failing report"
    verify:
      - "make test-automation"
      - "make test-drift"

  - id: AUTO-540
    phase: phase-5
    stretch: true
    title: Add a bounded topology smoke test to CI
    status: planned
    depends_on: [AUTO-530]
    acceptance:
      - "Render and drift checks are added to the CI-050 quality gate"
      - "The topology smoke test has explicit time and resource bounds"
      - "CI never requires committed credentials"
    verify:
      - "Run the documented local CI-equivalent command"
      - "Record GitHub check readback"
